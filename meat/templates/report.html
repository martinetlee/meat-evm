<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEAT-EVM Report</title>
<style>
:root {
  --bg: hsl(220, 15%, 8%);
  --surface: hsl(220, 15%, 12%);
  --surface2: hsl(220, 15%, 16%);
  --border: hsl(220, 10%, 22%);
  --text: hsl(0, 0%, 88%);
  --text-dim: hsl(0, 0%, 55%);
  --accent: hsl(200, 80%, 55%);
  --accent-dim: hsl(200, 60%, 30%);
  --red: hsl(0, 70%, 55%);
  --red-dim: hsl(0, 50%, 20%);
  --green: hsl(140, 60%, 45%);
  --green-dim: hsl(140, 40%, 18%);
  --yellow: hsl(45, 80%, 55%);
  --yellow-dim: hsl(45, 50%, 20%);
  --purple: hsl(270, 60%, 60%);
  --purple-dim: hsl(270, 40%, 22%);
  --orange: hsl(25, 80%, 55%);
  --blue: hsl(210, 70%, 55%);
  --blue-dim: hsl(210, 50%, 20%);
  --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-title { font-size: 18px; font-weight: 600; font-family: var(--font-mono); }
.header-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Badges */
.badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.badge-red { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
.badge-green { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
.badge-yellow { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow); }
.badge-blue { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }
.badge-purple { background: var(--purple-dim); color: var(--purple); border: 1px solid var(--purple); }
.badge-accent { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }

/* Tabs */
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; }
.tab { padding: 10px 18px; cursor: pointer; color: var(--text-dim); font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.15s, border-color 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Tab content */
.tab-content { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
.tab-content.active { display: block; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; background: var(--surface2); color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
th:hover { color: var(--text); }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: var(--surface2); }

/* Address */
.addr { font-family: var(--font-mono); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.addr a { color: var(--accent); }
.addr .copy-btn { cursor: pointer; opacity: 0.4; font-size: 11px; transition: opacity 0.15s; border: none; background: none; color: var(--text); padding: 0 2px; }
.addr .copy-btn:hover { opacity: 1; }
.addr .copy-btn.copied { color: var(--green); opacity: 1; }

/* Collapsible */
.collapsible-header { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 0; color: var(--text-dim); font-size: 13px; }
.collapsible-header:hover { color: var(--text); }
.collapsible-header .arrow { transition: transform 0.15s; display: inline-block; }
.collapsible-header.open .arrow { transform: rotate(90deg); }
.collapsible-body { display: none; padding: 8px 0; }
.collapsible-body.open { display: block; }

/* JSON viewer */
.json-viewer { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-family: var(--font-mono); font-size: 12px; overflow-x: auto; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.json-key { color: var(--accent); }
.json-str { color: var(--green); }
.json-num { color: var(--orange); }
.json-bool { color: var(--purple); }
.json-null { color: var(--text-dim); }

/* Callout */
.callout { border-left: 3px solid var(--accent); background: var(--surface2); padding: 12px 16px; border-radius: 0 6px 6px 0; margin-bottom: 16px; }
.callout-red { border-left-color: var(--red); }
.callout-green { border-left-color: var(--green); }
.callout-yellow { border-left-color: var(--yellow); }
.callout-title { font-weight: 600; margin-bottom: 6px; font-size: 13px; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 700; font-family: var(--font-mono); }
.stat-value.red { color: var(--red); }
.stat-value.green { color: var(--green); }

/* Flow diagram — Cytoscape.js container */
#cy-container { width: 100%; height: 600px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
.flow-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
.flow-legend-item { display: flex; align-items: center; gap: 5px; }
.flow-legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }
.flow-controls { display: flex; gap: 8px; margin-bottom: 10px; }
.flow-controls button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.flow-controls button:hover { background: var(--border); }

/* Sequence diagram */
.seq-diagram { overflow-x: auto; margin-bottom: 20px; }
.seq-header { display: flex; position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.seq-col-header { flex: 0 0 auto; text-align: center; padding: 8px 4px; font-size: 11px; font-weight: 600; border-radius: 6px; margin: 0 2px; min-width: 90px; }
.seq-body { position: relative; }
.seq-lifelines { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; pointer-events: none; }
.seq-lifeline { flex: 0 0 auto; min-width: 90px; margin: 0 2px; display: flex; justify-content: center; }
.seq-lifeline-bar { width: 2px; background: var(--border); }
.seq-step { position: relative; display: flex; align-items: center; min-height: 44px; padding: 4px 0; }
.seq-arrow { position: absolute; height: 2px; top: 50%; display: flex; align-items: center; }
.seq-arrow-line { flex: 1; height: 2px; }
.seq-arrow-head { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.seq-arrow-label { position: absolute; top: -16px; white-space: nowrap; font-size: 10px; font-family: var(--font-mono); padding: 1px 4px; background: var(--bg); border-radius: 2px; }
.seq-step-num { position: absolute; left: 4px; font-size: 10px; color: var(--text-dim); font-weight: 600; }

/* Timeline */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-entry { position: relative; margin-bottom: 20px; padding-left: 16px; }
.timeline-entry::before { content: ''; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; border: 2px solid var(--bg); }
.timeline-date { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); margin-bottom: 4px; }
.timeline-text { font-size: 13px; white-space: pre-wrap; }

/* Findings markdown */
.findings-content { font-size: 13px; line-height: 1.7; }
.findings-content h1 { font-size: 18px; margin: 20px 0 10px; }
.findings-content h2 { font-size: 15px; margin: 16px 0 8px; color: var(--accent); }
.findings-content h3 { font-size: 14px; margin: 12px 0 6px; }
.findings-content code { font-family: var(--font-mono); background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.findings-content pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
.findings-content pre code { background: none; padding: 0; }
.findings-content table { margin: 8px 0; }
.findings-content blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }

/* Section heading */
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* Empty state */
.empty-state { text-align: center; padding: 40px; color: var(--text-dim); }

/* Transfer row colors */
.transfer-in { color: var(--green); }
.transfer-out { color: var(--red); }

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .tabs { padding: 0 8px; }
  .tab { padding: 8px 12px; font-size: 12px; }
  .tab-content { padding: 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
</head>
<body>

<div class="header">
  <div class="header-title" id="header-title"></div>
  <div class="header-meta" id="header-meta"></div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="overview">Overview</div>
  <div class="tab" data-tab="transactions">Transactions</div>
  <div class="tab" data-tab="flow">Fund Flow</div>
  <div class="tab" data-tab="addresses">Addresses</div>
  <div class="tab" data-tab="technical">Technical</div>
  <div class="tab" data-tab="evidence">Evidence</div>
  <div class="tab" data-tab="timeline">Timeline</div>
</div>

<div class="tab-content active" id="tab-overview"></div>
<div class="tab-content" id="tab-transactions"></div>
<div class="tab-content" id="tab-flow"></div>
<div class="tab-content" id="tab-addresses"></div>
<div class="tab-content" id="tab-technical"></div>
<div class="tab-content" id="tab-evidence"></div>
<div class="tab-content" id="tab-timeline"></div>

<script>
const REPORT_DATA = {{REPORT_DATA}};

// ── Helpers ──
function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function $$(sel, ctx) { return Array.from((ctx || document).querySelectorAll(sel)); }
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  if (children) (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

function shortAddr(addr) {
  if (!addr || addr.length < 10) return addr || '';
  return addr.slice(0, 6) + '...' + addr.slice(-4);
}

function addrEl(addr, explorerUrl) {
  if (!addr) return el('span', {text: '—'});
  const url = explorerUrl ? `${explorerUrl}/address/${addr}` : '#';
  const container = el('span', {class: 'addr'});
  container.appendChild(el('a', {href: url, target: '_blank', text: shortAddr(addr), title: addr}));
  const btn = el('button', {class: 'copy-btn', text: '⧉', title: 'Copy address', onclick: () => {
    navigator.clipboard.writeText(addr).then(() => { btn.textContent = '✓'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '⧉'; btn.classList.remove('copied'); }, 1500); });
  }});
  container.appendChild(btn);
  return container;
}

function txLink(hash, explorerUrl) {
  if (!hash) return el('span', {text: '—'});
  const url = explorerUrl ? `${explorerUrl}/tx/${hash}` : '#';
  return el('a', {href: url, target: '_blank', text: shortAddr(hash), title: hash});
}

function badge(text, type) { return el('span', {class: `badge badge-${type}`, text: text}); }

function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  const num = typeof n === 'string' ? parseFloat(n) : n;
  if (isNaN(num)) return n;
  return num.toLocaleString('en-US', {maximumFractionDigits: 2});
}

function fmtWei(weiStr, decimals) {
  if (!weiStr) return '0';
  const d = decimals || 18;
  const n = BigInt(weiStr);
  const div = BigInt(10) ** BigInt(d);
  const whole = n / div;
  const frac = n % div;
  const fracStr = frac.toString().padStart(d, '0').slice(0, 4).replace(/0+$/, '');
  return whole.toLocaleString('en-US') + (fracStr ? '.' + fracStr : '');
}

function exploitLabel(type) {
  const labels = {
    key_compromise: 'Private Key Compromise',
    smart_contract_exploit: 'Smart Contract Exploit',
    governance_attack: 'Governance Attack',
    access_control_exploit: 'Access Control Exploit',
    bridge_exploit: 'Bridge Exploit',
    approval_abuse: 'Approval Abuse',
    proxy_upgrade_attack: 'Proxy Upgrade Attack',
    signature_replay: 'Signature Replay',
    oracle_manipulation: 'Oracle Manipulation',
    rebase_fee_exploit: 'Rebase/Fee Exploit',
    denial_of_service: 'Denial of Service',
    social_engineering: 'Social Engineering',
    unknown: 'Unknown',
  };
  return labels[type] || type;
}

function confidenceBadge(level) {
  const colors = {CONFIRMED: 'red', HIGH: 'red', MEDIUM: 'yellow', LOW: 'blue', UNKNOWN: 'accent'};
  return badge(level || 'UNKNOWN', colors[level] || 'accent');
}

function roleBadge(role) {
  const colors = {victim: 'blue', attacker: 'red', collector: 'red', funder: 'yellow', intermediate: 'accent', exchange: 'green', mixer: 'yellow', bridge: 'purple'};
  return badge(role || 'unknown', colors[role] || 'accent');
}

function collapsible(title, contentFn) {
  const wrap = el('div');
  const header = el('div', {class: 'collapsible-header', html: `<span class="arrow">▶</span> ${title}`});
  const body = el('div', {class: 'collapsible-body'});
  let loaded = false;
  header.onclick = () => {
    header.classList.toggle('open');
    body.classList.toggle('open');
    if (!loaded) { contentFn(body); loaded = true; }
  };
  wrap.appendChild(header);
  wrap.appendChild(body);
  return wrap;
}

function syntaxHighlight(json) {
  if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
  return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, (match) => {
      let cls = 'json-str';
      if (match.endsWith(':')) { cls = 'json-key'; match = match.slice(0, -1) + ':'; }
      return `<span class="${cls}">${match}</span>`;
    })
    .replace(/\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g, '<span class="json-num">$1</span>')
    .replace(/\b(true|false)\b/g, '<span class="json-bool">$1</span>')
    .replace(/\bnull\b/g, '<span class="json-null">null</span>');
}

function simpleMarkdown(md) { return renderMarkdown(md); }

function renderMarkdown(md) {
  if (!md) return '';
  let html = md;

  // Code blocks (fenced)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const escaped = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<pre><code class="lang-${lang||'text'}">${escaped}</code></pre>`;
  });

  // Tables
  html = html.replace(/((?:^\|.+\|$\n?)+)/gm, (block) => {
    const rows = block.trim().split('\n').filter(r => r.trim());
    if (rows.length < 2) return block;
    let tableHtml = '<table>';
    rows.forEach((row, i) => {
      const cells = row.split('|').filter(c => c !== '');
      if (!cells.length) return;
      if (cells.every(c => /^[\s\-:]+$/.test(c.trim()))) return;
      const tag = i === 0 ? 'th' : 'td';
      const rowTag = i === 0 ? 'thead' : (i === 1 ? 'tbody' : '');
      let prefix = rowTag === 'thead' ? '<thead>' : (rowTag === 'tbody' ? '<tbody>' : '');
      let suffix = rowTag === 'thead' ? '</thead>' : '';
      tableHtml += `${prefix}<tr>${cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('')}</tr>${suffix}`;
    });
    tableHtml += '</tbody></table>';
    return tableHtml;
  });

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Inline formatting
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // Lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (match) => `<ul>${match}</ul>`);
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*(<h[1-4]|<pre|<table|<ul|<ol)/g, '$1');
  html = html.replace(/(<\/h[1-4]>|<\/pre>|<\/table>|<\/ul>|<\/ol>)\s*<\/p>/g, '$1');
  html = html.replace(/<p>\s*<\/p>/g, '');

  return html;
}

function sortTable(table, colIdx, type) {
  const tbody = table.querySelector('tbody') || table;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const dir = table.dataset.sortDir === 'asc' ? 'desc' : 'asc';
  table.dataset.sortDir = dir;
  rows.sort((a, b) => {
    let va = a.cells[colIdx]?.textContent?.trim() || '';
    let vb = b.cells[colIdx]?.textContent?.trim() || '';
    if (type === 'num') { va = parseFloat(va.replace(/[,$]/g, '')) || 0; vb = parseFloat(vb.replace(/[,$]/g, '')) || 0; }
    const cmp = type === 'num' ? va - vb : va.localeCompare(vb);
    return dir === 'asc' ? cmp : -cmp;
  });
  rows.forEach(r => tbody.appendChild(r));
}

const D = REPORT_DATA;
const C = D.case;
const explorerUrl = C.explorer_url;

// ── Tab Navigation ──
$$('.tab').forEach(tab => {
  tab.onclick = () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    $$('.tab-content').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    $(`#tab-${tab.dataset.tab}`).classList.add('active');
  };
});

// ── Header ──
$('#header-title').textContent = `MEAT ∙ ${C.name}`;
const hm = $('#header-meta');
hm.appendChild(badge(C.chain, 'accent'));
hm.appendChild(badge(exploitLabel(C.exploit_type), 'red'));
hm.appendChild(confidenceBadge(C.confidence));
hm.appendChild(badge(C.status, C.status === 'active' ? 'yellow' : 'green'));

// ── Overview Tab ──
(function renderOverview() {
  const container = $('#tab-overview');
  const summary = C.summary || {};

  // Stats
  const stats = el('div', {class: 'stats-grid'});
  const stolen = summary.total_stolen || {};
  const stolenEntries = Object.entries(stolen);
  const totalUsd = summary.total_stolen_usd || (stolenEntries.length ? '' : '$0');

  stats.appendChild((() => { const s = el('div', {class: 'stat-card'}); s.appendChild(el('div', {class: 'stat-label', text: 'Total Stolen'})); s.appendChild(el('div', {class: 'stat-value red', text: totalUsd || '—'})); return s; })());
  stats.appendChild((() => { const s = el('div', {class: 'stat-card'}); s.appendChild(el('div', {class: 'stat-label', text: 'Recovered'})); s.appendChild(el('div', {class: 'stat-value green', text: summary.total_recovered_usd || '$0'})); return s; })());
  stats.appendChild((() => { const s = el('div', {class: 'stat-card'}); s.appendChild(el('div', {class: 'stat-label', text: 'Attack Txs'})); s.appendChild(el('div', {class: 'stat-value', text: String(summary.attack_txs || D.transactions.length || 0)})); return s; })());
  stats.appendChild((() => { const s = el('div', {class: 'stat-card'}); s.appendChild(el('div', {class: 'stat-label', text: 'Addresses'})); s.appendChild(el('div', {class: 'stat-value', text: String(Object.keys(D.addresses).length)})); return s; })());
  container.appendChild(stats);

  // Exploit-type callout
  const indicators = D.exploit_indicators[C.exploit_type];
  if (indicators) {
    const callout = el('div', {class: 'callout callout-red'});
    callout.appendChild(el('div', {class: 'callout-title', text: exploitLabel(C.exploit_type) + ' Indicators'}));
    const ul = el('ul', {style: 'padding-left: 18px; font-size: 13px;'});
    Object.entries(indicators).forEach(([k, v]) => {
      const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const val = typeof v === 'boolean' ? (v ? '✓' : '✗') : String(v);
      ul.appendChild(el('li', {text: `${label}: ${val}`}));
    });
    callout.appendChild(ul);
    container.appendChild(callout);
  }

  // Primary finding: analysis.md rendered as main content (NOT collapsible)
  const analysisMd = (D.findings || {})['analysis'];
  if (analysisMd) {
    container.appendChild(el('div', {class: 'section-title', text: 'Attack Analysis'}));
    container.appendChild(el('div', {class: 'card'}, [el('div', {class: 'findings-content', html: renderMarkdown(analysisMd)})]));
  }

  // Stolen breakdown
  if (stolenEntries.length) {
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'card-title', text: 'Stolen Assets'}));
    const tbl = el('table');
    tbl.innerHTML = '<thead><tr><th>Token</th><th>Amount</th></tr></thead>';
    const tbody = el('tbody');
    stolenEntries.forEach(([tok, amt]) => {

      tr.appendChild(el('td', {text: tok}));
      tr.appendChild(el('td', {text: fmtNum(amt)}));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    card.appendChild(el('div', {class: 'table-wrap'}, [tbl]));
    container.appendChild(card);
  }

  // Actors table
  const addrEntries = Object.entries(D.addresses);
  if (addrEntries.length) {
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'card-title', text: 'Key Actors'}));
    const tbl = el('table');
    tbl.innerHTML = '<thead><tr><th>Address</th><th>Role</th><th>Confidence</th><th>Reason</th></tr></thead>';
    const tbody = el('tbody');
    addrEntries.forEach(([addr, info]) => {
      const tr = el('tr');
      const tdAddr = el('td'); tdAddr.appendChild(addrEl(addr, explorerUrl)); tr.appendChild(tdAddr);
      const tdRole = el('td'); tdRole.appendChild(roleBadge(info.role)); tr.appendChild(tdRole);
      tr.appendChild(el('td', {text: info.confidence || '—'}));
      tr.appendChild(el('td', {text: info.reason || '—', style: 'max-width: 400px; font-size: 12px;'}));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    card.appendChild(el('div', {class: 'table-wrap'}, [tbl]));
    container.appendChild(card);
  }

  // Open questions
  if (C.open_questions && C.open_questions.length) {
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'card-title', text: 'Open Questions'}));
    const ul = el('ul', {style: 'padding-left: 18px; font-size: 13px; color: var(--text-dim);'});
    C.open_questions.forEach(q => ul.appendChild(el('li', {text: q})));
    card.appendChild(ul);
    container.appendChild(card);
  }

  // Other findings (recon, fund-trace, etc.) as collapsible
  const otherFindings = Object.entries(D.findings || {}).filter(([name]) => name !== 'analysis');
  if (otherFindings.length) {
    otherFindings.forEach(([name, md]) => {
      container.appendChild(collapsible(`Finding: ${name}`, (body) => {
        body.appendChild(el('div', {class: 'findings-content', html: renderMarkdown(md)}));
      }));
    });
  }
})();

// ── Fund Flow Tab (Cytoscape.js) ──
(function renderFlow() {
  const container = $('#tab-flow');
  const flow = D.flow;

  if (!flow || !flow.nodes || !flow.nodes.length) {
    container.appendChild(el('div', {class: 'empty-state', text: 'No fund flow data. Run /meat-trace to generate flow graph.'}));
    return;
  }

  container.appendChild(el('div', {class: 'section-title', text: 'Fund Flow Diagram'}));

  // Legend
  const legend = el('div', {class: 'flow-legend'});
  [['Collector/Attacker','#d94040','solid'],['Victim','#4a90d9','solid'],['Exchange/CEX','#4caf50','solid'],['Likely Infra','#81c784','double'],['Mixer','#e6a817','solid'],['Bridge','#9c6ad6','solid'],['Unknown','#666','solid']].forEach(([label, color, border]) => {
    const item = el('div', {class: 'flow-legend-item'});
    item.appendChild(el('div', {class: 'flow-legend-dot', style: `border-color: ${color}; background: ${color}33; border-style: ${border};`}));
    item.appendChild(el('span', {text: label}));
    legend.appendChild(item);
  });
  // Shape legend
  const shapeSep = el('span', {text: '|', style: 'color:var(--border); margin: 0 2px;'});
  legend.appendChild(shapeSep);
  const newItem = el('div', {class: 'flow-legend-item'});
  newItem.appendChild(el('div', {class: 'flow-legend-dot', style: 'border-color: #888; background: transparent; border-style: dashed;'}));
  newItem.appendChild(el('span', {text: 'Recently created'}));
  legend.appendChild(newItem);
  const oldItem = el('div', {class: 'flow-legend-item'});
  oldItem.appendChild(el('div', {class: 'flow-legend-dot', style: 'border-color: #888; background: transparent; border-style: solid;'}));
  oldItem.appendChild(el('span', {text: 'Established'}));
  legend.appendChild(oldItem);
  container.appendChild(legend);

  // Controls
  const controls = el('div', {class: 'flow-controls', style: 'align-items:center; flex-wrap:wrap;'});
  const btnFit = el('button', {text: 'Fit', onclick: () => cy && cy.fit(null, 30)});
  const btnReset = el('button', {text: 'Reset', onclick: () => { if (cy) { cy.elements().removeClass('highlighted dimmed new-addr old-addr'); updateAgeStyles(); cy.fit(null, 30); removeDetailPanel(); } }});
  controls.appendChild(btnFit);
  controls.appendChild(btnReset);

  // Age threshold control
  const ageSep = el('span', {text: '|', style: 'color:var(--border); margin: 0 4px;'});
  controls.appendChild(ageSep);
  const ageLabel = el('label', {text: 'New if created within ', style: 'font-size:12px; color:var(--text-dim);'});
  const ageInput = el('input', {type: 'number', value: '7', style: 'width:48px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:3px; padding:2px 6px; font-size:12px; text-align:center;'});
  const ageUnit = el('span', {text: ' days of attack', style: 'font-size:12px; color:var(--text-dim);'});
  ageLabel.appendChild(ageInput);
  ageLabel.appendChild(ageUnit);
  controls.appendChild(ageLabel);
  container.appendChild(controls);

  // Cytoscape container
  const cyDiv = el('div', {id: 'cy-container'});
  container.appendChild(cyDiv);

  // Deduplicate edges (spam already filtered server-side via DeFiLlama)
  const edgeSet = new Set();
  const dedupedEdges = (flow.edges || []).filter(e => {
    const key = `${e.from}-${e.to}-${e.tx_hash}`;
    if (edgeSet.has(key)) return false;
    edgeSet.add(key);
    return true;
  });

  // Aggregate edges by from→to
  const edgeAgg = {};
  dedupedEdges.forEach(e => {
    const key = `${e.from.toLowerCase()}-${e.to.toLowerCase()}`;
    if (!edgeAgg[key]) edgeAgg[key] = { from: e.from, to: e.to, tokens: {}, count: 0, totalWei: BigInt(0) };
    const token = e.token || 'ETH';
    const val = BigInt(e.value || '0');
    edgeAgg[key].tokens[token] = (edgeAgg[key].tokens[token] || BigInt(0)) + val;
    edgeAgg[key].totalWei += val;
    edgeAgg[key].count++;
  });

  // Role → color map
  const roleColors = {
    attacker: '#d94040', collector: '#d94040', root: '#d94040',
    victim: '#4a90d9',
    exchange: '#4caf50', cex: '#4caf50',
    mixer: '#e6a817',
    bridge: '#9c6ad6',
    funder: '#e6a817',
    intermediate: '#888',
    unknown: '#666',
  };

  // Build Cytoscape elements
  const nodeMap = {};
  flow.nodes.forEach(n => { nodeMap[n.address.toLowerCase()] = n; });
  const addrInfo = D.addresses || {};

  // Only include nodes that appear in edges
  const nodesInEdges = new Set();
  Object.values(edgeAgg).forEach(agg => {
    nodesInEdges.add(agg.from.toLowerCase());
    nodesInEdges.add(agg.to.toLowerCase());
  });

  const cyNodes = [];
  const seenNodes = new Set();
  nodesInEdges.forEach(addr => {
    if (seenNodes.has(addr)) return;
    seenNodes.add(addr);
    const node = nodeMap[addr] || {};
    const addrData = addrInfo[addr] || addrInfo[Object.keys(addrInfo).find(k => k.toLowerCase() === addr)] || {};
    const role = addrData.role || node.role || node.type || 'unknown';
    const color = roleColors[role] || roleColors.unknown;
    const label = node.label || addrData.role || (role !== 'unknown' ? role : '');
    const balance = node.balance || addrData.classify?.balance_formatted || '';
    // Override color for high infra score (likely public infrastructure)
    const infraScore = node.infra_score || 0;
    let finalColor = color;
    let infraLabel = '';
    if (role === 'unknown' && infraScore >= 50) {
      finalColor = '#81c784';  // light green
      infraLabel = 'infra?';
    }
    const displayLabel = infraLabel
      ? `${infraLabel}\n${label ? label + '\\n' : ''}${shortAddr(addr)}`
      : (label ? `${label}\n${shortAddr(addr)}` : shortAddr(addr));

    cyNodes.push({
      data: {
        id: addr,
        label: displayLabel,
        fullAddr: addr,
        role: role,
        color: finalColor,
        balance: balance,
        nonce: node.nonce,
        gasFunder: node.gas_funder || '',
        firstFundedAt: node.first_funded_at || '',
        firstFundedTs: node.first_funded_at ? new Date(node.first_funded_at).getTime() : 0,
        infraScore: infraScore,
        infraSignals: (node.infra_signals || []).join(', '),
      }
    });
  });

  // Compute max edge value for width scaling
  const maxVal = Math.max(...Object.values(edgeAgg).map(a => Number(a.totalWei / BigInt(10**14)) / 10000), 1);

  // Token decimal hints — USDC/USDT are 6 decimals, most others 18
  const tokenDecimals = {USDCE: 6, USDC: 6, USDT: 6, DAI: 18, WETH: 18, WMATIC: 18};

  const cyEdges = Object.values(edgeAgg).map((agg, i) => {
    const valEth = Number(agg.totalWei / BigInt(10**14)) / 10000;
    const width = Math.max(1, Math.min(8, (valEth / maxVal) * 8));
    const label = Object.entries(agg.tokens)
      .map(([t, v]) => {
        const dec = tokenDecimals[t.toUpperCase()] || 18;
        const formatted = fmtWei(String(v), dec);
        if (formatted === '0' || formatted === '0.0000') return null;
        return `${formatted} ${t}`;
      })
      .filter(Boolean)
      .join('\n');
    return {
      data: {
        id: `e${i}`,
        source: agg.from.toLowerCase(),
        target: agg.to.toLowerCase(),
        label: label.length > 35 ? label.slice(0, 32) + '...' : label,
        width: width,
        count: agg.count,
      }
    };
  });

  // Initialize Cytoscape
  const cy = cytoscape({
    container: cyDiv,
    elements: [...cyNodes, ...cyEdges],
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(label)',
          'text-wrap': 'wrap',
          'text-valign': 'center',
          'text-halign': 'center',
          'font-size': '10px',
          'font-family': 'SF Mono, Fira Code, Consolas, monospace',
          'color': '#e0e0e0',
          'text-outline-color': '#1a1d24',
          'text-outline-width': 2,
          'background-color': 'data(color)',
          'background-opacity': 0.2,
          'border-width': 2,
          'border-color': 'data(color)',
          'width': 130,
          'height': 50,
          'shape': 'round-rectangle',
          'padding': '8px',
        }
      },
      {
        selector: 'edge',
        style: {
          'width': 'data(width)',
          'line-color': '#444',
          'target-arrow-color': '#666',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'label': 'data(label)',
          'font-size': '8px',
          'font-family': 'SF Mono, Fira Code, Consolas, monospace',
          'color': '#999',
          'text-rotation': 'autorotate',
          'text-background-color': '#1a1d24',
          'text-background-opacity': 0.85,
          'text-background-padding': '2px',
          'text-wrap': 'wrap',
          'arrow-scale': 0.8,
        }
      },
      {
        selector: '.highlighted',
        style: {
          'border-width': 3,
          'border-color': '#fff',
          'background-opacity': 0.4,
          'z-index': 10,
        }
      },
      {
        selector: 'edge.highlighted',
        style: {
          'line-color': '#4fc3f7',
          'target-arrow-color': '#4fc3f7',
          'width': e => Math.max(parseFloat(e.data('width')) || 1, 3),
          'z-index': 10,
        }
      },
      {
        selector: '.dimmed',
        style: {
          'opacity': 0.15,
        }
      },
      {
        selector: '.infra-node',
        style: {
          'border-width': 4,
          'border-style': 'double',
          'shape': 'round-rectangle',
        }
      },
      {
        selector: '.new-addr',
        style: {
          'border-style': 'dashed',
          'border-width': 3,
          'shape': 'cut-rectangle',
        }
      },
      {
        selector: '.old-addr',
        style: {
          'border-style': 'solid',
          'shape': 'round-rectangle',
        }
      },
    ],
    layout: {
      name: 'dagre',
      rankDir: 'LR',
      nodeSep: 40,
      rankSep: 180,
      edgeSep: 20,
      padding: 30,
    },
    minZoom: 0.15,
    maxZoom: 3,
    wheelSensitivity: 0.3,
  });

    cy.nodes().forEach(node => {

      if (!ts || ts === 0) {
        // No funding data — leave unstyled
      } else if (attackDate - ts < thresholdMs) {
        node.addClass('new-addr');
      } else {
        node.addClass('old-addr');
      }
    });
  }
  ageInput.addEventListener('change', updateAgeStyles);
  ageInput.addEventListener('input', updateAgeStyles);

  // Precompute per-node inflow, outflow, net per token
  const nodeFlows = {};
  dedupedEdges.forEach(e => {
    const from = e.from.toLowerCase();
    const to = e.to.toLowerCase();
    const token = e.token || 'ETH';
    const val = BigInt(e.value || '0');
    if (!nodeFlows[from]) nodeFlows[from] = {};
    if (!nodeFlows[to]) nodeFlows[to] = {};
    if (!nodeFlows[from][token]) nodeFlows[from][token] = { in: BigInt(0), out: BigInt(0) };
    if (!nodeFlows[to][token]) nodeFlows[to][token] = { in: BigInt(0), out: BigInt(0) };
    nodeFlows[from][token].out += val;
    nodeFlows[to][token].in += val;
  });

  // Apply infra class to high-scoring nodes

    // Highlight

    cy.elements().addClass('dimmed');
    const connected = node.connectedEdges();
    const neighbors = node.neighborhood();
    node.removeClass('dimmed').addClass('highlighted');
    connected.removeClass('dimmed').addClass('highlighted');
    neighbors.nodes().removeClass('dimmed').addClass('highlighted');

      } else {
        infoGrid.appendChild(val);
      }
    };
    addInfo('Balance:', d.balance, 'font-family:var(--font-mono); font-weight:600; font-size:14px;');
    addInfo('Nonce:', d.nonce !== undefined ? fmtNum(d.nonce) : undefined);
    if (d.gasFunder) {
      addInfo('Gas funder:', addrEl(d.gasFunder, explorerUrl));
    }
    if (d.firstFundedAt) {

    }
    if (d.infraScore > 0) {
      const scoreColor = d.infraScore >= 50 ? '#81c784' : d.infraScore >= 25 ? '#e6a817' : 'var(--text-dim)';
      const scoreEl = el('span', {text: `${d.infraScore}/100`, style: `font-family:var(--font-mono); font-weight:600; color:${scoreColor};`});
      addInfo('Infra score:', scoreEl);
    }
    detailPanel.appendChild(infoGrid);

    // Infra signals breakdown
    if (d.infraSignals) {
      const sigDiv = el('div', {style: 'margin-bottom:10px; font-size:11px; color:var(--text-dim);'});
      sigDiv.appendChild(el('div', {text: 'Scoring signals:', style: 'font-size:10px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px;'}));
      d.infraSignals.split(', ').forEach(s => {
        if (s) sigDiv.appendChild(el('div', {text: '  ' + s, style: 'font-family:var(--font-mono);'}));
      });
      detailPanel.appendChild(sigDiv);
    }

    // Token flows: inflow, outflow, net
    const flows = nodeFlows[addr.toLowerCase()];
    if (flows && Object.keys(flows).length) {
      const flowDiv = el('div', {style: 'margin-bottom:10px;'});
      flowDiv.appendChild(el('div', {text: 'Token Flows (in graph)', style: 'font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;'}));

      Object.entries(flows).forEach(([token, vals]) => {
        const inVal = vals.in;
        const outVal = vals.out;
        if (inVal === BigInt(0) && outVal === BigInt(0)) return;
        const netVal = inVal - outVal;
        const dec = tokenDecimals[token.toUpperCase()] || 18;
        const fmtIn = fmtWei(String(inVal), dec);
        const fmtOut = fmtWei(String(outVal), dec);
        const fmtNet = fmtWei(String(netVal < BigInt(0) ? -netVal : netVal), dec);
        const netSign = netVal > BigInt(0) ? '+' : netVal < BigInt(0) ? '-' : '';
        const netColor = netVal > BigInt(0) ? 'var(--green)' : netVal < BigInt(0) ? 'var(--red)' : 'var(--text-dim)';

        const tokenBlock = el('div', {style: 'margin-bottom:8px; padding:8px; background:hsl(220,15%,16%); border-radius:4px;'});
        tokenBlock.appendChild(el('div', {text: token, style: 'font-weight:600; font-size:11px; margin-bottom:6px; color:var(--accent);'}));

        const grid = el('div', {style: 'display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-family:var(--font-mono); font-size:12px;'});
        grid.appendChild(el('span', {text: 'In:', style: 'color:var(--text-dim);'}));
        grid.appendChild(el('span', {text: `+${fmtIn}`, style: 'color:var(--green); text-align:right;'}));
        grid.appendChild(el('span', {text: 'Out:', style: 'color:var(--text-dim);'}));
        grid.appendChild(el('span', {text: `-${fmtOut}`, style: 'color:var(--red); text-align:right;'}));
        grid.appendChild(el('span', {text: 'Net:', style: 'color:var(--text-dim); font-weight:600;'}));
        grid.appendChild(el('span', {text: `${netSign}${fmtNet}`, style: `color:${netColor}; text-align:right; font-weight:600;`}));
        tokenBlock.appendChild(grid);
        flowDiv.appendChild(tokenBlock);
      });
      detailPanel.appendChild(flowDiv);
    }

    // Connected edge counts
    const inEdges = connected.filter(e => e.data('target') === node.id());
    const outEdges = connected.filter(e => e.data('source') === node.id());
    const statsDiv = el('div', {style: 'display:grid; grid-template-columns:1fr 1fr; gap:6px;'});
    const inBox = el('div', {style: 'padding:6px 8px; background:hsl(140,40%,18%); border-radius:4px; text-align:center;'});
    inBox.appendChild(el('div', {text: 'Inbound', style: 'font-size:10px; color:var(--green); margin-bottom:2px;'}));
    inBox.appendChild(el('div', {text: `${inEdges.length} txs`, style: 'font-size:14px; font-weight:600;'}));
    statsDiv.appendChild(inBox);
    const outBox = el('div', {style: 'padding:6px 8px; background:hsl(0,50%,20%); border-radius:4px; text-align:center;'});
    outBox.appendChild(el('div', {text: 'Outbound', style: 'font-size:10px; color:var(--red); margin-bottom:2px;'}));
    outBox.appendChild(el('div', {text: `${outEdges.length} txs`, style: 'font-size:14px; font-weight:600;'}));
    statsDiv.appendChild(outBox);
    detailPanel.appendChild(statsDiv);

    container.appendChild(detailPanel);
  });

  // Click background → reset
  cy.on('tap', function(evt) {
    if (evt.target === cy) {
      cy.elements().removeClass('highlighted dimmed');
      removeDetailPanel();
    }
  });

  // Transfers table below graph
  container.appendChild(el('div', {class: 'section-title', text: 'All Transfers'}));
  const tbl = el('table');
  tbl.innerHTML = '<thead><tr><th>From</th><th>To</th><th>Amount</th><th>Token</th><th>Tx</th><th>Time</th></tr></thead>';
  const tbody = el('tbody');
  dedupedEdges.slice(0, 100).forEach(e => {
    const tr = el('tr');
    const tdF = el('td'); tdF.appendChild(addrEl(e.from, explorerUrl)); tr.appendChild(tdF);
    const tdT = el('td'); tdT.appendChild(addrEl(e.to, explorerUrl)); tr.appendChild(tdT);
    tr.appendChild(el('td', {text: fmtWei(e.value, tokenDecimals[(e.token||'').toUpperCase()] || 18)}));
    tr.appendChild(el('td', {text: e.token || '?'}));
    const tdTx = el('td'); tdTx.appendChild(txLink(e.tx_hash, explorerUrl)); tr.appendChild(tdTx);
    tr.appendChild(el('td', {text: e.timestamp ? e.timestamp.replace('T', ' ').slice(0, 19) : '—', style: 'white-space: nowrap; font-size: 11px;'}));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  container.appendChild(el('div', {class: 'card'}, [el('div', {class: 'table-wrap'}, [tbl])]));

  // Recovery summary
  const recovery = flow.recovery || [];
  if (recovery.length) {
    container.appendChild(el('div', {class: 'section-title', text: 'Recovery Summary'}));
    const rtbl = el('table');
    rtbl.innerHTML = '<thead><tr><th>Category</th><th>Label</th><th>Amount</th><th>Status</th></tr></thead>';
    const rtbody = el('tbody');
    recovery.forEach(r => {
      const tr = el('tr');
      tr.appendChild(el('td', {text: r.category}));
      tr.appendChild(el('td', {text: r.label}));
      tr.appendChild(el('td', {text: r.amount_usd || '—'}));
      const tdS = el('td'); tdS.appendChild(badge(r.status || 'unknown', r.status === 'potentially_recoverable' ? 'green' : 'yellow')); tr.appendChild(tdS);
      rtbody.appendChild(tr);
    });
    rtbl.appendChild(rtbody);
    container.appendChild(el('div', {class: 'card'}, [el('div', {class: 'table-wrap'}, [rtbl])]));
  }
})();

// ── Technical Tab ──
(function renderTechnical() {
  const container = $('#tab-technical');
  const analysis = D.analysis || {};

  const hasVuln = analysis.vulnerability;
  const hasTrace = analysis.call_trace;
  const hasSource = analysis.source_files && analysis.source_files.length;
  const hasDiffs = analysis.storage_diffs && analysis.storage_diffs.length;
  const hasWalkthrough = analysis.attack_walkthrough && analysis.attack_walkthrough.length;
  const hasContracts = analysis.contracts_involved && analysis.contracts_involved.length;
  const hasFlashLoan = analysis.flash_loan;
  const hasProfit = analysis.profit_breakdown;
  const hasData = hasVuln || hasTrace || hasSource || hasDiffs || hasWalkthrough;

  if (!hasData) {
    const type = C.exploit_type;
    const contractTypes = ['smart_contract_exploit', 'access_control_exploit', 'oracle_manipulation', 'proxy_upgrade_attack', 'rebase_fee_exploit'];
    if (contractTypes.includes(type)) {
      container.appendChild(el('div', {class: 'empty-state', text: 'No technical analysis data yet. Run /meat-analyze to fetch call traces and source code.'}));
    } else {
      container.appendChild(el('div', {class: 'empty-state', html: `Technical analysis is not typically applicable for <strong>${exploitLabel(type)}</strong> exploits.<br>Use the Fund Flow and Transactions tabs for this exploit type.`}));
    }
    return;
  }

  // ── 1. Vulnerability card ──
  if (hasVuln) {
    const v = analysis.vulnerability;
    const callout = el('div', {class: 'callout callout-red', style: 'margin-bottom: 20px;'});
    callout.appendChild(el('div', {class: 'callout-title', text: 'Vulnerability', style: 'font-size: 15px;'}));
    const grid = el('div', {style: 'display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px;'});
    const addField = (label, val, style) => { if (!val) return; grid.appendChild(el('span', {text: label, style: 'color: var(--text-dim); font-weight: 500;'})); grid.appendChild(el('span', {text: val, style: style || ''})); };
    addField('Type:', v.type);
    addField('Severity:', v.severity, v.severity?.toLowerCase() === 'critical' ? 'color: var(--red); font-weight: 600; text-transform: uppercase;' : '');
    addField('Affected:', v.affected_contract);
    addField('Root Cause:', v.root_cause, 'line-height: 1.5;');
    addField('Confidence:', v.confidence);
    callout.appendChild(grid);
    container.appendChild(callout);
  }

  // ── 2. Contract relationship map ──
  if (hasContracts) {
    container.appendChild(el('div', {class: 'section-title', text: 'Contracts Involved'}));
    const ctbl = el('table');
    ctbl.innerHTML = '<thead><tr><th>Address</th><th>Name</th><th>Role</th></tr></thead>';
    const ctbody = el('tbody');
    analysis.contracts_involved.forEach(c => {
      const tr = el('tr');
      const addr = c.address || '';
      const tdAddr = el('td'); tdAddr.appendChild(addrEl(addr.replace(/`/g,''), explorerUrl)); tr.appendChild(tdAddr);
      tr.appendChild(el('td', {text: c.name || '—'}));
      const role = c.role || '';
      const roleColor = role.toLowerCase().includes('attacker') ? 'var(--red)' : role.toLowerCase().includes('victim') ? 'var(--blue)' : 'var(--text-dim)';
      tr.appendChild(el('td', {text: role, style: `color: ${roleColor};`}));
      ctbody.appendChild(tr);
    });
    ctbl.appendChild(ctbody);
    container.appendChild(el('div', {class: 'card'}, [el('div', {class: 'table-wrap'}, [ctbl])]));
  }

  // ── 4. Attack sequence diagram (from call trace) + walkthrough ──
  const callSeq = analysis.call_sequence;
  if (callSeq && callSeq.calls && callSeq.calls.length) {
    container.appendChild(el('div', {class: 'section-title', text: 'Attack Sequence'}));

    // Build ordered columns from contracts that appear in calls
    const seenOrder = [];
    const seenSet = new Set();
    callSeq.calls.forEach(c => {
      [c.from, c.to].forEach(addr => {
        if (!seenSet.has(addr)) { seenSet.add(addr); seenOrder.push(addr); }
      });
    });

    // Build column info with labels and protocol groups
    const contracts = callSeq.contracts || {};
    const protocols = callSeq.protocol_groups || {};
    const colAddrs = seenOrder.filter(a => contracts[a]);
    if (colAddrs.length < 2) colAddrs.push(...seenOrder.slice(0, 8));

    // Limit columns to keep diagram readable
    const MAX_COLS = 10;
    const displayCols = colAddrs.slice(0, MAX_COLS);
    const colIndex = {};
    displayCols.forEach((a, i) => { colIndex[a] = i; });

    const roleColorMap = {
      attacker: '#d94040', collector: '#d94040',
      victim: '#4a90d9',
      intermediate: '#888', funder: '#e6a817',
      exchange: '#4caf50',
    };

    const COL_W = Math.max(100, Math.min(140, 1100 / displayCols.length));
    const totalW = displayCols.length * (COL_W + 4) + 30;

    const diagram = el('div', {class: 'seq-diagram card', style: 'padding: 16px; overflow-x: auto;'});

    // Protocol group headers — only show above actual member columns
    const groupRow = el('div', {style: `display: flex; width: ${totalW}px; margin-bottom: 4px; padding-left: 26px;`});
    displayCols.forEach((addr, i) => {
      const proto = contracts[addr]?.protocol || '';
      const protoColor = proto ? 'var(--accent)' : 'transparent';
      const gDiv = el('div', {
        text: proto || '',
        style: `width: ${COL_W}px; margin: 0 2px; text-align: center; font-size: 9px; color: ${protoColor}; text-transform: uppercase; letter-spacing: 0.5px; ${proto ? 'border-bottom: 1px solid var(--accent);' : ''} padding-bottom: 2px;`,
      });
      groupRow.appendChild(gDiv);
    });
    diagram.appendChild(groupRow);

    // Column headers with contract address + label
    const headerRow = el('div', {class: 'seq-header', style: `width: ${totalW}px; padding-left: 26px;`});
    displayCols.forEach(addr => {
      const info = contracts[addr] || {};
      const label = info.label || '';
      const isUnlabeled = !label;
      const color = isUnlabeled ? '#555' : (roleColorMap[info.role] || '#888');
      const hdr = el('div', {
        class: 'seq-col-header',
        style: `width: ${COL_W}px; color: ${color}; border: 1px ${isUnlabeled ? 'dashed' : 'solid'} ${color}; background: ${color}15;`,
      });
      hdr.appendChild(el('div', {text: label || 'unidentified', style: `font-size: 11px; font-weight: 600; margin-bottom: 2px; ${isUnlabeled ? 'font-style: italic; opacity: 0.6;' : ''}`}));
      const addrRow = el('div', {style: 'display: flex; align-items: center; justify-content: center; gap: 2px;'});
      addrRow.appendChild(el('a', {href: `${explorerUrl}/address/${addr}`, target: '_blank', text: shortAddr(addr), title: addr, style: 'font-size: 9px; color: var(--text-dim); font-family: var(--font-mono);'}));
      const copyBtn = el('button', {class: 'copy-btn', text: '⧉', title: 'Copy address', style: 'font-size: 9px;', onclick: (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(addr).then(() => { copyBtn.textContent = '✓'; copyBtn.classList.add('copied'); setTimeout(() => { copyBtn.textContent = '⧉'; copyBtn.classList.remove('copied'); }, 1500); });
      }});
      addrRow.appendChild(copyBtn);
      hdr.appendChild(addrRow);
      headerRow.appendChild(hdr);
    });
    diagram.appendChild(headerRow);

    // Body with lifelines and arrows
    const filteredCalls = callSeq.calls.filter(c =>
      colIndex[c.from] !== undefined && colIndex[c.to] !== undefined && c.from !== c.to
    );
    const body = el('div', {class: 'seq-body', style: `width: ${totalW}px; min-height: ${Math.min(filteredCalls.length, 60) * 36}px;`});

    // Lifelines
    const lifelines = el('div', {class: 'seq-lifelines', style: 'padding-left: 26px;'});
    displayCols.forEach(() => {
      const ll = el('div', {class: 'seq-lifeline', style: `width: ${COL_W}px;`});
      ll.appendChild(el('div', {class: 'seq-lifeline-bar'}));
      lifelines.appendChild(ll);
    });
    body.appendChild(lifelines);

    const phaseColors = {setup: 'var(--text-dim)', manipulation: 'var(--red)', extraction: 'var(--yellow)', cashout: 'var(--green)'};
    const allCalls = callSeq.calls || [];
    const phases = callSeq.phases || [];

    function renderArrow(c, stepNum, parent) {
      const srcIdx = colIndex[c.from];
      const tgtIdx = colIndex[c.to];
      if (srcIdx === undefined || tgtIdx === undefined || c.from === c.to) return;
      const leftIdx = Math.min(srcIdx, tgtIdx);
      const rightIdx = Math.max(srcIdx, tgtIdx);
      const goingRight = tgtIdx > srcIdx;
      const leftPx = 26 + leftIdx * (COL_W + 4) + COL_W / 2;
      const rightPx = 26 + rightIdx * (COL_W + 4) + COL_W / 2;
      const arrowW = rightPx - leftPx;

      const arrowColor = c.error ? '#d94040' :
        c.function?.includes('flashLoan') || c.function?.includes('Flash') ? '#e6a817' :
        c.function?.includes('swap') || c.function?.includes('exactInput') ? '#4caf50' :
        '#4fc3f7';

      const stepRow = el('div', {class: 'seq-step', style: 'min-height: 32px;'});
      stepRow.appendChild(el('div', {class: 'seq-step-num', text: String(stepNum)}));

      const arrow = el('div', {class: 'seq-arrow', style: `left: ${leftPx}px; width: ${arrowW}px;`});
      arrow.appendChild(el('div', {class: 'seq-arrow-line', style: `background: ${arrowColor};`}));
      if (goingRight) {
        arrow.appendChild(el('div', {class: 'seq-arrow-head', style: `border-left: 7px solid ${arrowColor};`}));
      } else {
        arrow.insertBefore(el('div', {class: 'seq-arrow-head', style: `border-right: 7px solid ${arrowColor};`}), arrow.firstChild);
      }

      const funcLabel = c.function || '';
      const errSuffix = c.error ? ' REVERT' : '';
      const hasDetail = c.params || c.effect;
      const label = el('div', {
        class: 'seq-arrow-label',
        text: funcLabel + errSuffix,
        style: `left: ${arrowW / 2 - 30}px; color: ${arrowColor}; max-width: ${arrowW - 10}px; overflow: hidden; text-overflow: ellipsis;`,
        title: c.effect || `${contracts[c.from]?.label || shortAddr(c.from)} → ${contracts[c.to]?.label || shortAddr(c.to)}: ${funcLabel}`,
      });
      arrow.appendChild(label);
      stepRow.appendChild(arrow);

      if (hasDetail) {
        stepRow.style.cursor = 'pointer';
        let detailEl = null;
        stepRow.addEventListener('click', (e) => {
          e.stopPropagation();
          if (detailEl) { detailEl.remove(); detailEl = null; return; }
          detailEl = el('div', {style: 'background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin: 2px 26px 6px; padding: 10px 12px; font-size: 11px;'});
          if (c.effect) {
            detailEl.appendChild(el('div', {text: c.effect, style: 'color: var(--accent); font-style: italic; margin-bottom: 8px;'}));
          }
          if (c.params && typeof c.params === 'object') {
            const grid = el('div', {style: 'display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin-bottom: 6px;'});
            Object.entries(c.params).forEach(([k, v]) => {
              grid.appendChild(el('div', {text: k, style: 'color: var(--text-dim); font-family: var(--font-mono);'}));
              const valEl = el('div', {style: 'font-family: var(--font-mono); word-break: break-all;'});
              valEl.textContent = typeof v === 'string' ? v : JSON.stringify(v);
              grid.appendChild(valEl);
            });
            detailEl.appendChild(grid);
          }
          if (c.signature) {
            detailEl.appendChild(el('div', {text: c.signature, style: 'font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 4px;'}));
          }
          parent.insertBefore(detailEl, stepRow.nextSibling);
        });
      }
      parent.appendChild(stepRow);
    }

    if (phases.length > 0) {
      // Phase-based rendering
      let globalStep = 1;
      phases.forEach((phase, phaseIdx) => {
        const color = phaseColors[phase.phase] || 'var(--yellow)';
        // Phase header
        const header = el('div', {style: `display: flex; align-items: center; padding: 8px 4px; margin: 6px 0 2px; cursor: pointer; user-select: none; border-radius: 6px; background: ${color}08;`});
        const chevron = el('span', {text: phase.collapsed_default ? '▶' : '▼', style: `font-size: 10px; color: ${color}; width: 16px; flex-shrink: 0;`});
        header.appendChild(chevron);
        header.appendChild(el('div', {style: `flex: 1; height: 1px; background: ${color}; opacity: 0.3; margin: 0 6px;`}));
        const badge = el('div', {style: `padding: 3px 12px; border: 1px solid ${color}; border-radius: 12px; font-size: 11px; font-weight: 600; color: ${color}; white-space: nowrap; background: hsl(220,15%,14%);`});
        badge.textContent = phase.title || '';
        if (phase.purpose) badge.title = phase.purpose;
        header.appendChild(badge);
        const countLabel = el('span', {text: ` (${phase.call_count} calls)`, style: `font-size: 10px; color: var(--text-dim); margin-left: 6px; flex-shrink: 0;`});
        header.appendChild(countLabel);
        header.appendChild(el('div', {style: `flex: 1; height: 1px; background: ${color}; opacity: 0.3; margin: 0 6px;`}));

        // Phase body (collapsible)
        const phaseBody = el('div', {});
        if (phase.collapsed_default) phaseBody.style.display = 'none';

        let visibleCount = 0;
        for (let i = phase.start_index; i <= phase.end_index && i < allCalls.length; i++) {
          const c = allCalls[i];
          if (colIndex[c.from] !== undefined && colIndex[c.to] !== undefined && c.from !== c.to) {
            renderArrow(c, globalStep, phaseBody);
            globalStep++;
            visibleCount++;
          }
        }

        // Skip phases with no visible calls
        if (visibleCount === 0) return;

        countLabel.textContent = ` (${visibleCount} calls)`;

        header.addEventListener('click', () => {
          const visible = phaseBody.style.display !== 'none';
          phaseBody.style.display = visible ? 'none' : '';
          chevron.textContent = visible ? '▶' : '▼';
        });

        body.appendChild(header);
        body.appendChild(phaseBody);
      });
    } else {
      // Fallback: flat rendering (no phases)
      let stepNum = 1;
      const maxFlat = 100;
      for (let i = 0; i < allCalls.length && stepNum <= maxFlat; i++) {
        const c = allCalls[i];
        if (colIndex[c.from] !== undefined && colIndex[c.to] !== undefined && c.from !== c.to) {
          renderArrow(c, stepNum, body);
          stepNum++;
        }
      }
      if (filteredCalls.length > maxFlat) {
        body.appendChild(el('div', {text: `... ${filteredCalls.length - maxFlat} more calls`, style: 'text-align: center; color: var(--text-dim); font-size: 11px; padding: 8px;'}));
      }
    }

    diagram.appendChild(body);
    container.appendChild(diagram);
  }

  if (hasWalkthrough) {
    container.appendChild(el('div', {class: 'section-title', text: 'Attack Walkthrough Details'}));
    const walkDiv = el('div', {class: 'timeline'});
    analysis.attack_walkthrough.forEach((step, i) => {
      const entry = el('div', {class: 'timeline-entry'});
      entry.appendChild(el('div', {text: step.title, style: 'font-weight: 600; font-size: 14px; margin-bottom: 4px;'}));
      if (step.call) {
        const callBadge = el('div', {style: 'font-family: var(--font-mono); font-size: 12px; background: var(--surface2); padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; display: inline-block;'});
        callBadge.textContent = step.call;
        entry.appendChild(callBadge);
      }
      if (step.purpose) {
        entry.appendChild(el('div', {text: step.purpose, style: 'font-size: 13px; color: var(--text-dim); margin-bottom: 4px;'}));
      }
      if (step.source) {
        entry.appendChild(el('div', {html: `<span style="color:var(--text-dim)">Source:</span> <code style="font-size:11px">${step.source}</code>`, style: 'font-size: 12px; margin-bottom: 4px;'}));
      }
      if (step.usd_impact) {
        entry.appendChild(el('div', {text: `Impact: ${step.usd_impact}`, style: 'font-size: 12px; color: var(--red); font-weight: 500;'}));
      }
      if (step.details && step.details.length) {
        const detailsDiv = el('div', {style: 'font-size: 12px; color: var(--text-dim); margin-top: 4px;'});
        step.details.forEach(d => {
          if (d.startsWith('- ') || d.startsWith('* ')) {
            detailsDiv.appendChild(el('div', {text: '  ' + d, style: 'padding-left: 8px;'}));
          }
        });
        if (detailsDiv.children.length) entry.appendChild(detailsDiv);
      }
      walkDiv.appendChild(entry);
    });
    container.appendChild(walkDiv);
  }

  // ── 5. Profit breakdown ──
  if (hasProfit && Object.keys(hasProfit).length) {
    container.appendChild(el('div', {class: 'section-title', text: 'Profit Breakdown'}));
    const profCard = el('div', {class: 'card'});
    const profTbl = el('table');
    profTbl.innerHTML = '<thead><tr><th>Address</th><th>Token</th><th>Net Flow</th></tr></thead>';
    const profBody = el('tbody');
    Object.entries(analysis.profit_breakdown).forEach(([addr, tokens]) => {
      Object.entries(tokens).forEach(([tok, info]) => {
        const tr = el('tr');
        const tdA = el('td'); tdA.appendChild(addrEl(addr, explorerUrl)); tr.appendChild(tdA);
        tr.appendChild(el('td', {text: tok}));
        const val = typeof info === 'object' ? `${info.formatted || ''} (${info.usd_value || ''})` : String(info);
        const isNeg = val.startsWith('-');
        tr.appendChild(el('td', {text: val, style: `color: ${isNeg ? 'var(--red)' : 'var(--green)'}; font-family: var(--font-mono);`}));
        profBody.appendChild(tr);
      });
    });
    profTbl.appendChild(profBody);
    profCard.appendChild(el('div', {class: 'table-wrap'}, [profTbl]));
    container.appendChild(profCard);
  }

  // ── 6. Decoded call trace with filters ──
  if (hasTrace) {
    container.appendChild(el('div', {class: 'section-title', text: 'Call Trace'}));

    const KNOWN_SELS = {
      '0x095ea7b3':'approve','0xa9059cbb':'transfer','0x23b872dd':'transferFrom',
      '0x70a08231':'balanceOf','0x18160ddd':'totalSupply','0x313ce567':'decimals',
      '0x0b4c7e4d':'add_liquidity','0xb72df5de':'add_liquidity','0x3df02124':'exchange',
      '0xcc2b27d7':'remove_liq_one','0x1a4d01d2':'remove_liquidity',
      '0x4903b0d1':'remove_liq_one','0x4515cef3':'add_liquidity',
      '0xbb7b8b80':'get_virtual_price','0x42b0b77c':'supply',
      '0xe0232b42':'flashLoan','0x128acb08':'swap','0x414bf389':'exactInputSingle',
      '0x2e1a7d4d':'withdraw','0x5c60da1b':'implementation','0x4efecaa5':'withdraw',
      '0x40c10f19':'mint','0x79cc6790':'burnFrom','0xfeaf968c':'latestRoundData',
    };
    const NOISE_FUNCS = new Set(['balanceOf','totalSupply','decimals','latestRoundData','implementation']);

    const ADDR_LABELS = {};
    Object.entries(D.addresses).forEach(([addr, info]) => {
      const name = info.classify?.known_entity || info.labels?.[0] || '';
      if (name) ADDR_LABELS[addr.toLowerCase()] = name;
    });
    if (hasContracts) {
      analysis.contracts_involved.forEach(c => {
        const addr = (c.address || '').replace(/`/g, '').toLowerCase();
        if (addr && c.name) ADDR_LABELS[addr] = c.name;
      });
    }

    // Filter controls
    const filterDiv = el('div', {class: 'flow-controls', style: 'margin-bottom: 8px;'});
    let currentFilter = 'important';
    const filters = [
      {id: 'important', label: 'Key calls only'},
      {id: 'all', label: 'All calls'},
      {id: 'value', label: 'Value-carrying'},
      {id: 'errors', label: 'Errors only'},
    ];
    const traceCard = el('div', {class: 'card'});
    const traceTree = el('div', {style: 'font-family: var(--font-mono); font-size: 12px; overflow-x: auto; max-height: 600px; overflow-y: auto; padding: 8px;'});

    function shouldShow(call, depth, filter) {
      const inp = (call.input || '').slice(0, 10);
      const funcLabel = KNOWN_SELS[inp] || inp;
      const typ = call.type || 'CALL';
      const err = call.error || '';
      const valHex = call.value || '0x0';
      const val = parseInt(valHex, 16) / 1e18;
      if (filter === 'all') return true;
      if (filter === 'errors') return !!err;
      if (filter === 'value') return val > 0.0001;
      // 'important' — skip noise at depth
      if (typ === 'STATICCALL' && depth > 2) return false;
      if (typ === 'DELEGATECALL' && depth > 3) return false;
      if (NOISE_FUNCS.has(funcLabel) && depth > 2) return false;
      if (funcLabel === 'approve' && depth > 2) return false;
      return true;
    }

    function rebuildTrace(filter) {
      traceTree.innerHTML = '';
      const traceData = hasTrace.trace || hasTrace.internal_transactions || hasTrace;
      if (traceData && typeof traceData === 'object' && !Array.isArray(traceData)) {
        renderCallNode(traceData, 0, filter);
      } else if (Array.isArray(traceData)) {
        traceData.forEach(t => {
          const line = el('div', {style: 'white-space: pre; padding: 1px 0;'});
          line.textContent = `${t.type || 'CALL'} ${shortAddr(t.from || '')} → ${shortAddr(t.to || '')}`;
          traceTree.appendChild(line);
        });
      }
    }

    function renderCallNode(call, depth, filter) {
      if (depth > 10) return;
      const to = (call.to || '').toLowerCase();
      const inp = (call.input || '').slice(0, 10);
      const typ = call.type || 'CALL';
      const err = call.error || '';
      const valHex = call.value || '0x0';
      const val = parseInt(valHex, 16) / 1e18;

      if (shouldShow(call, depth, filter)) {
        const addrLabel = ADDR_LABELS[to] || shortAddr(to);
        const funcLabel = KNOWN_SELS[inp] || inp;
        const indent = '  '.repeat(depth);
        const valStr = val > 0.0001 ? ` [${val.toFixed(4)} ETH]` : '';
        const errStr = err ? ' REVERTED' : '';
        const typeColor = err ? 'var(--red)' : typ === 'STATICCALL' ? 'var(--text-dim)' : typ === 'DELEGATECALL' ? 'var(--purple)' : 'var(--text)';

        const line = el('div', {style: `color: ${typeColor}; white-space: pre; padding: 1px 0; cursor: pointer;`});
        const arrow = (call.calls && call.calls.length) ? '▸ ' : '  ';
        line.textContent = `${indent}${arrow}${addrLabel}.${funcLabel}${valStr}${errStr}`;
        line.title = `${typ} → ${to}\nSelector: ${inp}`;
        traceTree.appendChild(line);
      }

      (call.calls || []).forEach(sub => renderCallNode(sub, depth + 1, filter));
    }

    filters.forEach(f => {
      const btn = el('button', {text: f.label, style: f.id === currentFilter ? 'background: var(--accent-dim); border-color: var(--accent);' : '', onclick: () => {
        currentFilter = f.id;
        filterDiv.querySelectorAll('button').forEach(b => b.style.background = 'var(--surface2)');
        btn.style.background = 'var(--accent-dim)';
        rebuildTrace(f.id);
      }});
      filterDiv.appendChild(btn);
    });
    container.appendChild(filterDiv);

    rebuildTrace(currentFilter);
    traceCard.appendChild(traceTree);
    container.appendChild(traceCard);

    container.appendChild(collapsible('Raw Call Trace JSON', (body) => {
      body.appendChild(el('div', {class: 'json-viewer', html: syntaxHighlight(analysis.call_trace)}));
    }));
  }

  // ── 7. Source code viewer ──
  if (hasSource) {
    container.appendChild(el('div', {class: 'section-title', text: 'Contract Source Code'}));

    const vulnLines = new Set();
    const rootCause = analysis.vulnerability?.root_cause || '';
    const lineRefs = rootCause.match(/L\d+/g) || [];
    lineRefs.forEach(ref => vulnLines.add(parseInt(ref.slice(1))));

    analysis.source_files.forEach(src => {
      const name = src.contract_name || src.address || 'Contract';
      const compiler = src.compiler_version || '';
      const title = compiler ? `${name} (${compiler})` : name;
      const sourceCode = src.source_code || '';

      if (!sourceCode) {
        container.appendChild(collapsible(title, (body) => {
          body.appendChild(el('div', {class: 'json-viewer', html: syntaxHighlight(src)}));
        }));
        return;
      }

      container.appendChild(collapsible(title, (body) => {
        const codeDiv = el('div', {style: 'background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; max-height: 500px; overflow-y: auto;'});
        const lines = sourceCode.split('\n');
        lines.forEach((line, i) => {
          const lineNum = i + 1;
          const isHighlighted = vulnLines.has(lineNum);
          const bgStyle = isHighlighted ? 'background: hsl(0, 50%, 15%); border-left: 3px solid var(--red); padding-left: 9px;' : '';
          const lineEl = el('div', {style: `display: flex; font-family: var(--font-mono); font-size: 11px; line-height: 1.6; ${bgStyle}`});
          lineEl.appendChild(el('span', {text: String(lineNum).padStart(4), style: `color: ${isHighlighted ? 'var(--red)' : 'var(--text-dim)'}; user-select: none; min-width: 40px; text-align: right; padding-right: 12px;`}));
          let highlighted = line
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/(def |event |struct |interface |contract |function |pragma |import |from )/g, '<span style="color:var(--purple)">$1</span>')
            .replace(/(@external|@internal|@view|@nonreentrant|@pure|public|private|internal|external|view|pure|nonpayable|payable)/g, '<span style="color:var(--yellow)">$1</span>')
            .replace(/(uint256|int128|address|bool|bytes32|string|mapping|uint8|uint128)/g, '<span style="color:var(--accent)">$1</span>')
            .replace(/(#[^\n]*)/g, '<span style="color:var(--text-dim)">$1</span>')
            .replace(/("(?:[^"\\]|\\.)*")/g, '<span style="color:var(--green)">$1</span>');
          lineEl.appendChild(el('span', {html: highlighted, style: 'white-space: pre;'}));
          codeDiv.appendChild(lineEl);
        });
        body.appendChild(codeDiv);
      }));
    });
  }

  // ── 8. Storage diffs (before/after) ──
  if (hasDiffs) {
    container.appendChild(el('div', {class: 'section-title', text: 'Storage State Changes'}));
    analysis.storage_diffs.forEach(diff => {
      if (diff.before && diff.after) {
        const card = el('div', {class: 'card'});
        const grid = el('div', {style: 'display: grid; grid-template-columns: 1fr 1fr; gap: 12px;'});
        const beforeDiv = el('div', {style: 'padding: 8px; background: hsl(0,50%,15%); border-radius: 4px;'});
        beforeDiv.appendChild(el('div', {text: `Before (Block ${diff.before.block || '?'})`, style: 'font-size: 11px; color: var(--red); margin-bottom: 4px;'}));
        beforeDiv.appendChild(el('div', {text: diff.before.value || '?', style: 'font-family: var(--font-mono); font-size: 12px; word-break: break-all;'}));
        const afterDiv = el('div', {style: 'padding: 8px; background: hsl(140,40%,15%); border-radius: 4px;'});
        afterDiv.appendChild(el('div', {text: `After (Block ${diff.after.block || '?'})`, style: 'font-size: 11px; color: var(--green); margin-bottom: 4px;'}));
        afterDiv.appendChild(el('div', {text: diff.after.value || '?', style: 'font-family: var(--font-mono); font-size: 12px; word-break: break-all;'}));
        grid.appendChild(beforeDiv);
        grid.appendChild(afterDiv);
        card.appendChild(grid);
        container.appendChild(card);
      } else {
        container.appendChild(el('div', {class: 'json-viewer', html: syntaxHighlight(diff), style: 'margin-bottom: 8px;'}));
      }
    });
  }
})();

// ── Evidence Tab ──
(function renderEvidence() {
  const container = $('#tab-evidence');
  const index = D.evidence_index || [];

  if (!index.length) {
    container.appendChild(el('div', {class: 'empty-state', text: 'No evidence files collected yet.'}));
    return;
  }

  container.appendChild(el('div', {class: 'section-title', text: `Evidence Index (${index.length} files)`}));

  const tbl = el('table');
  tbl.innerHTML = '<thead><tr><th>Category</th><th>Key</th><th>Chain</th><th>Fetched</th><th>Size</th></tr></thead>';
  const tbody = el('tbody');
  index.forEach(item => {
    const tr = el('tr');
    tr.appendChild(el('td', {text: item.category}));
    tr.appendChild(el('td', {text: shortAddr(item.key), title: item.key, style: 'font-family: var(--font-mono); font-size: 12px;'}));
    tr.appendChild(el('td', {text: item.chain || '—'}));
    tr.appendChild(el('td', {text: item.fetched_at ? item.fetched_at.replace('T', ' ').slice(0, 19) : '—', style: 'font-size: 12px; white-space: nowrap;'}));
    tr.appendChild(el('td', {text: item.size_bytes ? `${(item.size_bytes / 1024).toFixed(1)} KB` : '—'}));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  container.appendChild(el('div', {class: 'card'}, [el('div', {class: 'table-wrap'}, [tbl])]));

  // Data sources summary
  const sources = new Set();
  index.forEach(i => { if (i.chain) sources.add(i.chain); });
  const categories = {};
  index.forEach(i => { categories[i.category] = (categories[i.category] || 0) + 1; });

  const card = el('div', {class: 'card'});
  card.appendChild(el('div', {class: 'card-title', text: 'Evidence Summary'}));
  const grid = el('div', {style: 'display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px;'});
  grid.appendChild(el('span', {text: 'Total files:', style: 'color: var(--text-dim);'}));
  grid.appendChild(el('span', {text: String(index.length)}));
  grid.appendChild(el('span', {text: 'Categories:', style: 'color: var(--text-dim);'}));
  grid.appendChild(el('span', {text: Object.entries(categories).map(([k, v]) => `${k} (${v})`).join(', ')}));
  grid.appendChild(el('span', {text: 'Chains:', style: 'color: var(--text-dim);'}));
  grid.appendChild(el('span', {text: Array.from(sources).join(', ') || '—'}));
  card.appendChild(grid);
  container.appendChild(card);
})();

// ── Timeline Tab ──
(function renderTimeline() {
  const container = $('#tab-timeline');
  const journal = D.journal || [];

  if (!journal.length) {
    container.appendChild(el('div', {class: 'empty-state', text: 'No journal entries yet.'}));
    return;
  }

  container.appendChild(el('div', {class: 'section-title', text: 'Investigation Timeline'}));

  // Case meta
  const metaCard = el('div', {class: 'card', style: 'margin-bottom: 20px;'});
  const grid = el('div', {style: 'display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px;'});
  const addRow = (l, v) => { grid.appendChild(el('span', {text: l, style: 'color: var(--text-dim);'})); grid.appendChild(el('span', {text: v || '—'})); };
  addRow('Created:', C.created);
  addRow('Last Updated:', C.last_updated);
  addRow('Last Monitored:', C.last_monitored);
  addRow('Status:', C.status);
  metaCard.appendChild(grid);
  container.appendChild(metaCard);

  // Timeline
  const timeline = el('div', {class: 'timeline'});
  journal.forEach(entry => {
    const item = el('div', {class: 'timeline-entry'});
    item.appendChild(el('div', {class: 'timeline-date', text: entry.timestamp}));
    item.appendChild(el('div', {class: 'timeline-text', text: entry.entry}));
    timeline.appendChild(item);
  });
  container.appendChild(timeline);

  // Monitored addresses
  const monitored = C.monitored_addresses || [];
  if (monitored.length) {
    container.appendChild(el('div', {class: 'section-title', text: 'Monitored Addresses', style: 'margin-top: 24px;'}));
    const tbl = el('table');
    tbl.innerHTML = '<thead><tr><th>Address</th><th>Role</th><th>Last Block</th></tr></thead>';
    const tbody = el('tbody');
    monitored.forEach(m => {
      const tr = el('tr');
      const td = el('td'); td.appendChild(addrEl(m.address, explorerUrl)); tr.appendChild(td);
      tr.appendChild(el('td', {text: m.role || '—'}));
      tr.appendChild(el('td', {text: String(m.last_tx_block || '—')}));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    container.appendChild(el('div', {class: 'card'}, [el('div', {class: 'table-wrap'}, [tbl])]));
  }
})();

// ── Set page title ──
document.title = `MEAT | ${C.name}`;
</script>
</body>
