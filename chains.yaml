chains:
  ethereum:
    chain_id: 1
    rpc_env: ETH_RPC_URL
    alchemy_network: eth-mainnet
    explorer_api_env: ETHERSCAN_API_KEY
    explorer_base: "https://api.etherscan.io/v2/api"
    explorer_url: "https://etherscan.io"
    native_token: ETH
    url_patterns:
      - "etherscan.io"
    trace_method: debug_traceTransaction
    trace_fallback: cast_run

  polygon:
    chain_id: 137
    rpc_env: POLYGON_RPC_URL
    alchemy_network: polygon-mainnet
    explorer_api_env: POLYGONSCAN_API_KEY
